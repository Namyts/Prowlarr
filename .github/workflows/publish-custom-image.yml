name: Sync upstream and publish image

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: custom-prowlarr-image
  cancel-in-progress: false

env:
  PATCH_BRANCH: master
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/prowlarr

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0

      - name: Rebase onto upstream master
        id: sync
        run: |
          before=$(git rev-parse HEAD)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/Prowlarr/Prowlarr.git
          git fetch upstream master
          git rebase upstream/master
          git push --force-with-lease origin HEAD:${PATCH_BRANCH}
          test "$before" = "$(git rev-parse HEAD)" && changed=false || changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: docker/setup-buildx-action@v3
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: docker/login-action@v3
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
