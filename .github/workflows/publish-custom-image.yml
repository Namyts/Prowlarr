name: Sync upstream and publish image

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: custom-prowlarr-image
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
      version: ${{ steps.sync.outputs.version }}
      assembly_version: ${{ steps.sync.outputs.assembly_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Rebase onto upstream master
        id: sync
        run: |
          before=$(git rev-parse HEAD)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/Prowlarr/Prowlarr.git
          git fetch --tags upstream master
          git rebase upstream/master
          git push --force-with-lease origin HEAD:master
          test "$before" = "$(git rev-parse HEAD)" && changed=false || changed=true
          # Nearest upstream release tag plus how far master is ahead of it, e.g. v2.6.4.5611-12-gabcdef
          version=$(git describe --tags --match 'v*' --always HEAD)
          # AssemblyVersion takes a numeric quad, so the app reports the release it is based on.
          release=$(git describe --tags --match 'v*' --abbrev=0 HEAD)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "assembly_version=${release#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # - arch: arm64
          #   platform: linux/arm64
          #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prowlarr" >> "$GITHUB_ENV"

      # Each arch is pushed under its own tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            PROWLARR_VERSION=${{ needs.sync.outputs.assembly_version }}
            PACKAGE_VERSION=${{ needs.sync.outputs.version }}
            PACKAGE_AUTHOR=[${{ github.repository_owner }}](${{ github.server_url }}/${{ github.repository }})
          tags: ${{ env.IMAGE_NAME }}:${{ needs.sync.outputs.version }}-${{ matrix.arch }}

      - name: Save image ref
        run: |
          mkdir -p /tmp/refs
          echo "$IMAGE_NAME:${{ needs.sync.outputs.version }}-${{ matrix.arch }}" > "/tmp/refs/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ref-${{ matrix.arch }}
          path: /tmp/refs/*
          retention-days: 1

  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/refs
          pattern: ref-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prowlarr" >> "$GITHUB_ENV"

      - name: Combine per-arch images into one manifest
        working-directory: /tmp/refs
        env:
          VERSION: ${{ needs.sync.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_NAME:latest" \
            -t "$IMAGE_NAME:$VERSION" \
            $(cat *)
